[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redis = { version = "0.24", features = ["tokio-comp"] }
reqwest = { version = "0.12", features = ["json"] }
dotenv = "0.15"
gcp_auth = "0.12.7"
tower-http = { version = "0.7.1", features = ["cors"] }
sqlx = { version = "0.8.3", features = ["runtime-tokio", "tls-native-tls", "postgres", "macros", "json"] }
dotenvy = "0.15.7"

[[bin]]
name = "backend"
path = "src/main.rs"